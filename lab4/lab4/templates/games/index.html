<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Gier</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            color: #2d3748;
            background: #f3f4f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f3f4f6;
            line-height: 1.6;
        }

        header {
            padding: 1.5em 1em;
            color: white;
            text-align: center;
            background-color: #2b6cb0;
        }

        h1 {
            margin: 0 0 0.5em;
            font-size: 1.8rem;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        nav a {
            padding: 6px 14px;
            border-radius: 4px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        nav a:hover,
        nav a[aria-current="page"] {
            background-color: rgba(255, 255, 255, 0.2);
        }

        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin: 0 0 0.35rem;
            color: #2b6cb0;
        }

        .description {
            margin-top: 0;
            color: #4a5568;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        label {
            color: #4a5568;
            font-weight: bold;
        }

        select,
        input[type="text"],
        input[type="number"],
        textarea,
        button {
            min-height: 38px;
            padding: 7px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            font: inherit;
        }

        select,
        input[type="text"],
        input[type="number"],
        textarea {
            color: #2d3748;
            background-color: #fff;
        }

        .form-section {
            margin: 1.5rem 0 2rem;
            padding: 1.25rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background-color: #f8fafc;
        }

        .form-section h3 {
            margin: 0 0 1rem;
            color: #2b6cb0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px 16px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-field-full {
            grid-column: 1 / -1;
        }

        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .form-actions {
            margin-top: 12px;
        }

        .success {
            border: 1px solid #9ae6b4;
            background-color: #f0fff4;
            color: #276749;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button {
            border-color: #2b6cb0;
            background-color: #2b6cb0;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        button:hover {
            border-color: #23558c;
            background-color: #23558c;
        }

        .message {
            padding: 8px 12px;
            margin-bottom: 12px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .loading {
            border: 1px solid #bee3f8;
            background-color: #ebf8ff;
            color: #2b6cb0;
        }

        .error {
            border: 1px solid #feb2b2;
            background-color: #fff5f5;
            color: #c53030;
        }

        .empty {
            border: 1px solid #f6e05e;
            background-color: #fffff0;
            color: #744210;
        }

        .game-card {
            margin-bottom: 12px;
            padding: 16px 20px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background-color: #fff;
        }

        .game-title {
            margin: 0 0 6px;
            color: #2b6cb0;
            font-size: 1.2em;
        }

        .game-meta {
            margin-bottom: 8px;
            color: #718096;
            font-size: 0.9em;
        }

        .game-desc {
            margin: 0;
            color: #4a5568;
            line-height: 1.4;
        }

        .badge {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
            vertical-align: middle;
        }

        .badge-multi {
            background-color: #c6f6d5;
            color: #276749;
        }

        .badge-single {
            background-color: #edf2f7;
            color: #4a5568;
        }

        .badge-status {
            background-color: #ebf8ff;
            color: #2b6cb0;
        }

        .badge-rating {
            background-color: #fefcbf;
            color: #975a16;
        }

        footer {
            padding: 1.5rem 1rem;
            color: #718096;
            text-align: center;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            nav a {
                display: block;
                width: 100%;
                max-width: 220px;
                background-color: rgba(255, 255, 255, 0.15);
            }

            main {
                margin: 1rem;
                padding: 1.2rem;
            }

            .controls {
                align-items: stretch;
                flex-direction: column;
            }

            select,
            button {
                width: 100%;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Aplikacja Django</h1>
        <nav>
            <a href="/">Strona główna</a>
            <a href="/taskboard/">TaskBoard</a>
            <a href="/games/" aria-current="page">Gry</a>
        </nav>
    </header>

    <main>
        <h2>Katalog gier</h2>
        <p class="description">Przeglądaj, filtruj oraz dodawaj nowe gry do bazy bez przeładowania strony.</p>

        <section class="form-section" aria-labelledby="add-game-heading">
            <h3 id="add-game-heading">Dodaj nową grę</h3>
            <form id="game-form">
                {% csrf_token %}
                <div class="form-grid">
                    <div class="form-field">
                        <label for="game-title">Tytuł gry</label>
                        <input id="game-title" type="text" name="title" maxlength="100" required placeholder="np. Wiedźmin 3: Dziki Gon">
                    </div>

                    <div class="form-field">
                        <label for="game-genre">Gatunek</label>
                        <input id="game-genre" type="text" name="genre" maxlength="50" required placeholder="np. RPG">
                    </div>

                    <div class="form-field">
                        <label for="game-year">Rok wydania</label>
                        <input id="game-year" type="number" name="release_year" min="1950" max="2100" required placeholder="np. 2015">
                    </div>

                    <div class="form-field">
                        <label for="game-platform">Platforma</label>
                        <input id="game-platform" type="text" name="platform" maxlength="50" value="PC" placeholder="np. PC / PS5">
                    </div>

                    <div class="form-field">
                        <label for="game-status">Status</label>
                        <select id="game-status" name="status">
                            <option value="released">Wydana</option>
                            <option value="early_access">Wczesny dostęp</option>
                            <option value="upcoming">Zapowiedziana</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="game-rating">Ocena (0–10, opcjonalnie)</label>
                        <input id="game-rating" type="number" name="rating" min="0" max="10" step="0.1" placeholder="np. 9.5">
                    </div>

                    <div class="form-field form-field-full">
                        <label for="game-description">Opis</label>
                        <textarea id="game-description" name="description" rows="3" maxlength="5000" required placeholder="Krótki opis gry..."></textarea>
                    </div>

                    <div class="form-field form-field-full">
                        <label class="checkbox-label">
                            <input id="game-multiplayer" type="checkbox" name="is_multiplayer">
                            Tryb multiplayer
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn">Dodaj</button>
                </div>
            </form>
            <p id="form-message" role="status"></p>
        </section>

        <div class="controls">
            <label for="multiplayer-filter">Tryb:</label>
            <select id="multiplayer-filter">
                <option value="">Wszystkie gry</option>
                <option value="true">Tylko multiplayer</option>
                <option value="false">Tylko dla jednego gracza</option>
            </select>

            <label for="status-filter">Status:</label>
            <select id="status-filter">
                <option value="">Wszystkie statusy</option>
                <option value="released">Wydana</option>
                <option value="early_access">Wczesny dostęp</option>
                <option value="upcoming">Zapowiedziana</option>
            </select>

            <label for="sort-select">Sortowanie:</label>
            <select id="sort-select">
                <option value="year_desc">Najnowsze</option>
                <option value="year_asc">Najstarsze</option>
                <option value="title">Tytuł A-Z</option>
                <option value="rating">Najwyższa ocena</option>
            </select>

            <button id="load-btn">Wczytaj dane</button>
            <button id="top-btn" type="button">Top 3 gry</button>
        </div>

        <div id="status-container"></div>
        <div id="games-container"></div>
    </main>

    <footer>
        <p>&copy; 2026 Autor: Jakub Olejnik</p>
    </footer>

    <script>
        const gameForm = document.getElementById('game-form');
        const submitBtn = document.getElementById('submit-btn');
        const formMessage = document.getElementById('form-message');
        const loadBtn = document.getElementById('load-btn');
        const topBtn = document.getElementById('top-btn');
        const filterSelect = document.getElementById('multiplayer-filter');
        const statusSelect = document.getElementById('status-filter');
        const sortSelect = document.getElementById('sort-select');
        const statusContainer = document.getElementById('status-container');
        const gamesContainer = document.getElementById('games-container');

        function buildGamesApiUrl() {
            const params = new URLSearchParams();
            if (filterSelect.value !== '') {
                params.set('multiplayer', filterSelect.value);
            }
            if (statusSelect.value !== '') {
                params.set('status', statusSelect.value);
            }
            if (sortSelect.value !== '') {
                params.set('sort', sortSelect.value);
            }

            const query = params.toString();
            return query ? `/games/api/?${query}` : '/games/api/';
        }

        function showFormMessage(text, type) {
            formMessage.className = type ? `message ${type}` : '';
            formMessage.textContent = text;
        }

        function fetchAndRenderGames(url) {
            // Komunikat o ładowaniu i czyszczenie widoku
            statusContainer.className = 'message loading';
            statusContainer.textContent = 'Ładowanie danych z serwera...';
            gamesContainer.replaceChildren();

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Błąd HTTP: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // Usunięcie komunikatu o ładowaniu
                    statusContainer.className = '';
                    statusContainer.textContent = '';

                    const items = data.items || [];
                    if (items.length === 0) {
                        statusContainer.className = 'message empty';
                        statusContainer.textContent = 'Brak gier spełniających wybrane kryteria.';
                        return;
                    }

                    // Bezpieczna aktualizacja DOM (textContent)
                    items.forEach(game => {
                        const card = document.createElement('div');
                        card.className = 'game-card';

                        const title = document.createElement('h3');
                        title.className = 'game-title';
                        title.textContent = game.title;

                        const badge = document.createElement('span');
                        badge.className = game.is_multiplayer ? 'badge badge-multi' : 'badge badge-single';
                        badge.textContent = game.is_multiplayer ? 'Multiplayer' : 'Singleplayer';
                        title.appendChild(badge);

                        if (game.status_display) {
                            const statusBadge = document.createElement('span');
                            statusBadge.className = 'badge badge-status';
                            statusBadge.textContent = game.status_display;
                            title.appendChild(statusBadge);
                        }

                        if (game.rating !== null && game.rating !== undefined) {
                            const ratingBadge = document.createElement('span');
                            ratingBadge.className = 'badge badge-rating';
                            ratingBadge.textContent = `Ocena: ${game.rating}/10`;
                            title.appendChild(ratingBadge);
                        }

                        const meta = document.createElement('div');
                        meta.className = 'game-meta';
                        meta.textContent = `Gatunek: ${game.genre} | Platforma: ${game.platform || 'PC'} | Rok wydania: ${game.release_year}`;

                        const desc = document.createElement('p');
                        desc.className = 'game-desc';
                        desc.textContent = game.description;

                        card.appendChild(title);
                        card.appendChild(meta);
                        card.appendChild(desc);

                        gamesContainer.appendChild(card);
                    });
                })
                .catch(error => {
                    statusContainer.className = 'message error';
                    statusContainer.textContent = `Wystąpił błąd podczas pobierania danych: ${error.message}`;
                });
        }

        gameForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const formData = new FormData(gameForm);
            const data = Object.fromEntries(formData.entries());
            delete data.csrfmiddlewaretoken;
            data.is_multiplayer = gameForm.querySelector('[name="is_multiplayer"]').checked;

            const csrfInput = gameForm.querySelector('[name="csrfmiddlewaretoken"]');
            const csrf = csrfInput ? csrfInput.value : '';

            submitBtn.disabled = true;
            showFormMessage('Wysyłanie danych...', 'loading');

            try {
                const response = await fetch('/games/api/add/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrf,
                    },
                    body: JSON.stringify(data),
                });

                let result = null;
                try {
                    result = await response.json();
                } catch (_) {
                    result = null;
                }

                if (!response.ok || !result || !result.ok) {
                    throw new Error((result && result.error) || `Nie udało się dodać gry (HTTP ${response.status}).`);
                }

                showFormMessage(result.message || 'Gra została pomyślnie dodana.', 'success');
                gameForm.reset();

                // Jeśli aktywne filtry ukryłyby nowy rekord, zresetuj je przed odświeżeniem listy.
                if (filterSelect.value !== '' && String(result.item.is_multiplayer) !== filterSelect.value) {
                    filterSelect.value = '';
                }
                if (statusSelect.value !== '' && result.item.status !== statusSelect.value) {
                    statusSelect.value = '';
                }

                fetchAndRenderGames(buildGamesApiUrl());
            } catch (error) {
                showFormMessage(error.message || 'Wystąpił błąd podczas zapisywania gry.', 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        loadBtn.addEventListener('click', () => {
            fetchAndRenderGames(buildGamesApiUrl());
        });

        topBtn.addEventListener('click', () => {
            fetchAndRenderGames('/games/api/top/');
        });

        // Wczytaj aktualną listę gier od razu po załadowaniu strony.
        fetchAndRenderGames(buildGamesApiUrl());
    </script>
</body>
</html>
